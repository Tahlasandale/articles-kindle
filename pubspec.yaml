name: articles_kindle
description: "Vos liens web en un livre EPUB, envoyé à votre Kindle par e-mail."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Base locale — sqlite3_flutter_libs est mort, les bibliothèques natives
  # viennent des build hooks de sqlite3 3.x (voir DECISIONS.md)
  drift: ^2.35.2
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Réseau — toujours derrière ArticleFetcher, jamais appelé en test
  dio: ^5.11.1

  # Contenu web
  html: ^0.15.7
  xml: ^6.6.1

  # EPUB et images
  archive: ^4.5.2
  image: ^4.12.0

  # Envoi — toujours derrière MailTransport, jamais réel en test
  mailer: ^7.2.0

  # Secrets : mot de passe SMTP uniquement
  flutter_secure_storage: ^11.2.0

  # Partage entrant Android
  receive_sharing_intent: ^1.9.0

  collection: ^1.19.1
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Libron
      fonts:
        - asset: assets/fonts/Libron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Libron-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Libron-Bold.ttf
          weight: 700
        - asset: assets/fonts/Libron-BoldItalic.ttf
          weight: 700
          style: italic